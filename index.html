<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>
    <h1>My Top 3 Memories of <span>This Year</span></h1>
    <ol>
      <li>
        <h3 id="mem1"> My Birthday Trip</h3>
        <p> I went to London for my 18th birthday and had a wonderful time.</p>
        <img
             id="London"
             src="https://i.pinimg.com/736x/6f/c7/1f/6fc71f2cf8812ad7bed26546c34d2db4.jpg"
             style="display:none"
             />
      </li>

      <li>
        <h3 id="mem2"> Cutting my hair</h3>
        <p> It felt good I felt good.</p>
        <img
             id="bob"
             src="https://i.pinimg.com/474x/7c/2e/65/7c2e65f6811141d593bca5fedd4d3b6d.jpg"
             style="display:none">
      </li>

      <li>
        <h3 id="mem3">The winter showcase </h3>
        <p> I loved going down in the basement for tech.</p>
        <img
             id="showcase"
             src="https://i.pinimg.com/736x/0e/12/c3/0e12c3489676bd66abcdd2580890c69b.jpg"
      </li>
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      $("#mem1-button").click(function () {
        $("#mem1").css("color", "purple");
        $("#mem1").css("background-color", "pink")
        $("#London").show(1000);
        
        
      });

      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
        $("#mem2").css("background-color", " purple")
        $("#bob").show(1000);
      });

      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
        $("#showcase").show(1000);
        
        $("h1").html("<u> London </u>")
        
      });
      // $("img").mouseout(function )) {
      // $("h1").text
        
    </script>
  </body>
</html>
